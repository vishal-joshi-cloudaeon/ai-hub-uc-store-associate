# Databricks Apps deployment config.
#
# DEV Databricks SQL credentials are injected as secret-backed env vars (see
# the "loyalty-approvals" secret scope). PROD isn't wired up yet — its
# service principal doesn't exist, so those env vars are simply absent here;
# database.py already treats an unconfigured env as "not configured" rather
# than crashing.
command: ["python", "app.py"]

env:
  - name: "DATABRICKS_SERVER_HOSTNAME_DEV"
    valueFrom: "databricks-server-hostname-dev"
  - name: "DATABRICKS_HTTP_PATH_DEV"
    valueFrom: "databricks-http-path-dev"
  - name: "DATABRICKS_CLIENT_ID_DEV"
    valueFrom: "databricks-client-id-dev"
  - name: "DATABRICKS_CLIENT_SECRET_DEV"
    valueFrom: "databricks-client-secret-dev"
  - name: "CATALOG"
    value: "dev"
  - name: "SCHEMA"
    value: "retail"
  - name: "CORS_ORIGIN"
    value: "https://uc-store-associate-ui-7405619621865526.6.azure.databricksapps.com"
