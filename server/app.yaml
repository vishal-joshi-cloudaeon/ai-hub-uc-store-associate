# Databricks Apps deployment config for the combined UI app: this Express
# process serves the built React SPA (copied into ./public at deploy time)
# AND the /agent Foundry proxy, as the app's single public listener.
#
# FOUNDRY_AGENT_ENDPOINT_DEV / FOUNDRY_AGENT_ID_DEV are copied from
# server/.env (not secret — a gateway URL and agent name, not a credential).
# dev calls the APIM "AI Hub" gateway (subscription-key auth) rather than
# Foundry directly; APIM_SUBSCRIPTION_KEY_DEV is a real credential and must
# be stored as a Databricks Apps secret named "apim-subscription-key-dev"
# (see `databricks secrets` / the app's secret scope), not a plain value.
# AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET are the
# "saw-web-app-deployment" Azure AD app registration DefaultAzureCredential
# picks up via EnvironmentCredential (see src/azureToken.ts) — it needs an
# RBAC role (e.g. "Foundry User") on dta-euw-prod-aifoundry-01, granted at
# the dta-euw-prod-rg-ai-01 resource-group scope, for actual chat calls to
# succeed (token acquisition alone isn't enough).
#
# APPROVALS_SERVICE_URL is the uc-store-associate-approvals app's own URL —
# src/approvalsProxy.ts calls it server-to-server using DATABRICKS_CLIENT_ID/
# DATABRICKS_CLIENT_SECRET, which Databricks Apps injects automatically for
# THIS app's own service principal (not set here). That service principal
# needs CAN_USE permission on uc-store-associate-approvals for this to work.
command: ["node", "dist/index.js"]

env:
  - name: "FOUNDRY_AGENT_ENDPOINT_DEV"
    value: "https://dta-euw-prod-apim-01.azure-api.net/saw-loyalty-agent-conversational-retail-assistant/invoke"
  - name: "FOUNDRY_AGENT_ID_DEV"
    value: "Loyalty-Agent"
  - name: "APIM_SUBSCRIPTION_KEY_DEV"
    valueFrom: "apim-subscription-key-dev"
  - name: "FOUNDRY_API_VERSION"
    value: "2025-05-15-preview"
  - name: "AZURE_TOKEN_SCOPE"
    value: "https://ai.azure.com/.default"
  - name: "CORS_ORIGIN"
    value: "https://uc-store-associate-ui-7405619621865526.6.azure.databricksapps.com"
  - name: "AZURE_TENANT_ID"
    valueFrom: "azure-tenant-id"
  - name: "AZURE_CLIENT_ID"
    valueFrom: "azure-client-id"
  - name: "AZURE_CLIENT_SECRET"
    valueFrom: "azure-client-secret"
  - name: "APPROVALS_SERVICE_URL"
    value: "https://uc-store-associate-approvals-7405619621865526.6.azure.databricksapps.com"
